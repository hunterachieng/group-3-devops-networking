name: Terraform

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

jobs:
  terraform:
    name: fmt / validate / test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      # Check formatting across the entire infra tree
      - name: fmt check
        run: terraform fmt -check -recursive infra/

      # Init without connecting to the S3 backend — downloads provider plugins only
      - name: init
        working-directory: infra/environments/lab
        run: terraform init -backend=false

      # Static validation — catches config errors without AWS credentials
      - name: validate
        working-directory: infra/environments/lab
        run: terraform validate

      # Full test suite:
      #   architecture.tftest.hcl          — input-validation rules (no creds needed)
      #   architecture_structural.tftest.hcl — structural rules via mock_provider (no creds needed)
      - name: test
        working-directory: infra/environments/lab
        run: terraform test -test-directory=tests

  # Real deploy against the AWS account. Only runs on main, after validate passes,
  # authenticating via GitHub's OIDC token — no long-lived AWS credentials stored
  # in this repo. The IAM role trust policy restricts assumption to this repo's
  # main branch only (see infra/bootstrap for how the role/OIDC provider were set up).
  deploy:
    name: terraform apply (lab)
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    env:
      # Repository variables (Settings → Secrets and variables → Actions).
      # Terraform auto-maps TF_VAR_* to input variables in infra/environments/lab.
      TF_VAR_slack_webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
      TF_VAR_slack_team_id: ${{ vars.SLACK_TEAM_ID }}
      TF_VAR_slack_channel_id: ${{ vars.SLACK_CHANNEL_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::240462142849:role/devops-g3-gha-deploy-role
          aws-region: us-west-1

      - name: init
        working-directory: infra/environments/lab
        run: terraform init -input=false

      - name: check Slack delivery configuration
        run: |
          if [ -n "$TF_VAR_slack_webhook_url" ]; then
            echo "SLACK_WEBHOOK_URL set — Lambda will post alarms to Slack."
          elif [ -n "$TF_VAR_slack_team_id" ] && [ -n "$TF_VAR_slack_channel_id" ]; then
            echo "Slack IDs set — AWS Chatbot will be managed (requires console OAuth)."
          else
            echo "::warning::Set SLACK_WEBHOOK_URL (recommended) or SLACK_TEAM_ID + SLACK_CHANNEL_ID."
          fi

      # Each service's SHA is published to SSM by its CodePipeline build. Reading
      # it here (instead of relying on defaults) means an infra-only merge never
      # accidentally rolls a running service back to REPLACE_ME.
      - name: resolve deployed image tags from SSM
        working-directory: infra/environments/lab
        run: |
          for svc in order inventory payment; do
            sha=$(aws ssm get-parameter --region us-west-1 \
              --name "/devops-g3-iac/$svc/image-tag" \
              --query 'Parameter.Value' --output text 2>/dev/null || echo "REPLACE_ME")
            echo "${svc}_image_tag=${sha}" >> "$GITHUB_ENV"
            echo "[$svc] using image tag: $sha"
          done

      - name: plan
        working-directory: infra/environments/lab
        run: |
          terraform plan -input=false \
            -var="order_image_tag=${order_image_tag}" \
            -var="inventory_image_tag=${inventory_image_tag}" \
            -var="payment_image_tag=${payment_image_tag}" \
            -out=tfplan

      - name: apply
        working-directory: infra/environments/lab
        run: terraform apply -input=false -auto-approve tfplan

      - name: verify Slack Lambda output
        if: env.TF_VAR_slack_webhook_url != ''
        working-directory: infra/environments/lab
        run: |
          enabled=$(terraform output -raw production_readiness_slack_lambda_enabled)
          if [ "$enabled" != "true" ]; then
            echo "::error::Expected production_readiness_slack_lambda_enabled=true after apply"
            exit 1
          fi
          echo "Slack Lambda notifier enabled — alarms will post via Incoming Webhook"
